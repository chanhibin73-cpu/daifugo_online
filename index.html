const StorageManager = {
    setItem: (key, value) => {
        let saved = false;
        try {
            // 先にバックアップを書き込み、メイン保存に失敗しても直前の完全なデータを残す。
            localStorage.setItem(`${key}_backup`, value);
            localStorage.setItem(key, value);
            saved = true;
        }
        catch (e) {
            try {
                localStorage.setItem(`${key}_backup`, value);
            } catch (e2) { }
        }
        if (!saved) {
            try {
                document.cookie = `${key}_backup=${encodeURIComponent(value)}; max-age=31536000; path=/`;
                document.cookie = `${key}=${encodeURIComponent(value)}; max-age=31536000; path=/`;
            }
            catch (e) { }
        }
    },
    getItem: (key) => {
        const isSaveKey = /^rpg_save_/.test(key);
        const isValidSave = (value) => {
            if (!value) return false;
            if (!isSaveKey) return true;
            try {
                const parsed = JSON.parse(value);
                return !!parsed && typeof parsed === 'object';
            } catch (e) {
                return false;
            }
        };
        try {
            const val = localStorage.getItem(key);
            if (isValidSave(val)) return val;
            const backup = localStorage.getItem(`${key}_backup`);
            if (isValidSave(backup)) {
                try { localStorage.setItem(key, backup); } catch (e) { }
                return backup;
            }
        }
        catch (e) {
            try {
                const backup = localStorage.getItem(`${key}_backup`);
                if (isValidSave(backup)) return backup;
            } catch (e2) { }
        }
        try {
            const escapedKey = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const match = document.cookie.match(new RegExp('(?:^|; )' + escapedKey + '=([^;]+)'));
            if (match) {
                const value = decodeURIComponent(match[1]);
                if (isValidSave(value)) return value;
            }
            const backupMatch = document.cookie.match(new RegExp('(?:^|; )' + escapedKey + '_backup=([^;]+)'));
            if (backupMatch) {
                const value = decodeURIComponent(backupMatch[1]);
                if (isValidSave(value)) {
                    try { document.cookie = `${key}=${encodeURIComponent(value)}; max-age=31536000; path=/`; } catch (e) { }
                    return value;
                }
            }
        }
        catch (e) { }
        return null;
    },
    removeItem: (key) => {
        try { localStorage.removeItem(key); localStorage.removeItem(`${key}_backup`); } catch (e) { }
        try {
            document.cookie = `${key}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/`;
            document.cookie = `${key}_backup=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/`;
        } catch (e) { }
    }
};

const BUFF_ID_ALIASES = {
    atk_up_30: 'atk_up',

};
const normalizeBuffId = (id) => BUFF_ID_ALIASES[id] || id;
const LEGACY_COMPOSITE_BUFF_EXPANSIONS = {
    all_up: ['atk_up', 'def_up', 'agi_up'],

const getBuffDefinition = (id) => {

const normalizeSkillEffectEntry = (entry, defaultTurns = 5) => {
    if (!entry) return null;

    return null;
};
const getSkillBuffEntries = (skill) => {
    if (!skill) return [];
    const expandEntries = (entries) => entries.flatMap(entry => {
        const e = normalizeSkillEffectEntry(entry);
        if (!e) return [];
        const normalizedType = normalizeBuffId(e.type);
        const expansion = LEGACY_COMPOSITE_BUFF_EXPANSIONS[normalizedType];
        return expansion ? expansion.map(type => ({ ...e, type })) : [e];
    });
    if (Array.isArray(skill.buffs)) return expandEntries(skill.buffs);
    if (skill.buff) return expandEntries([skill.buff]);

    if (Array.isArray(skill.buffIds)) return expandEntries(skill.buffIds.map(id => ({ type: id, turns: skill.duration ?? 5 })));
    if (skill.buffId) {

};
const getSkillDebuffEntries = (skill) => {

        if (!e) return [];
        const normalizedType = normalizeBuffId(e.type);
        const expansion = LEGACY_COMPOSITE_BUFF_EXPANSIONS[normalizedType];
        return expansion ? expansion.map(type => ({ ...e, type })) : [e];

        return e ? [e] : [];
    }

};

    let x = 0, y = 0, dx = 0, dy = -1;
    const coords = [];
    for (let i = 0; i < max; i++) {
        if (-11 / 2 < x && x <= 11 / 2 && -11 / 2 < y && y <= 11 / 2)
            coords.push({ x, y });
        if (x === y || (x < 0 && x === -y) || (x > 0 && x === 1 - y)) {
            let temp = dx;
            dx = -dy;
            dy = temp;
        }
        x += dx;
        y += dy;
    }
    return coords;
};

const playSound = (type) => {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        if (type === 'attack') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }
        else if (type === 'magic') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }
        else if (type === 'damage') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }
        else if (type === 'battle_end') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(523, audioCtx.currentTime);
            osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.12);

            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }
    }

};

const getExpBoostRemainingMs = (targetPlayer, now = Date.now()) => {
    if (!targetPlayer) return 0;
    let remaining = Number(targetPlayer.expBoostRemainingMs);
    if (!Number.isFinite(remaining)) {
        remaining = targetPlayer.expBoostUntil ? Math.max(0, targetPlayer.expBoostUntil - now) : 0;
    }
    const lastChecked = Number(targetPlayer.expBoostLastCheckedAt);
    if (Number.isFinite(lastChecked)) {
        const elapsed = now - lastChecked;
        if (elapsed > 0) remaining = Math.max(0, remaining - elapsed);
    }
    return Math.max(0, remaining);
};
